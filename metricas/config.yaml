default_doc_type: embargo

input_paths:
  embargo:
    gold: metricas/inputs/embargos/input_revision_manual/embargos_input.csv
    results_glob: metricas/inputs/embargos/pruebas_modelo/*.csv
  oficio:
    gold: metricas/inputs/oficios/input_revision_manual/oficios_input.csv
    results_glob: metricas/inputs/oficios/pruebas_modelo/*.csv

columns:
  document_id_candidates:
    - id
    - numero_archivo
    - nombre_archivo
  label: etiqueta
  value: valor
  text: texto_limpio
  score: score
  span_start: span_inicio
  span_end: span_fin

matching:
  rapidfuzz_threshold: 85
  length_tolerance: 3
  numeric_labels:
    - dni
    - cuit_cuil
    - cbu
    - cvu
    - monto
  fuzzy_labels:
    - persona
    - persona_juridica
    - alias
  label_aliases:
    person: persona
    national_id_number: dni
    government_id: dni
    tax_id: cuit_cuil
    bank_account: cbu
    account_number: cbu
    money: monto
    amount: monto

doc_types:
  embargo:
    required_labels: []
    optional_labels:
      - alias
      - persona_juridica
      - cuit_cuil
      - dni
      - cvu
      - cbu
      - monto
    regex_labels:
      - cuit_cuil
      - dni
      - cvu
      - cbu
      - monto
  oficio:
    required_labels: []
    optional_labels:
      - alias
      - persona_juridica
      - cuit_cuil
      - dni
      - cvu
      - cbu
      - monto
    regex_labels:
      - cuit_cuil
      - dni
      - cvu
      - cbu
      - monto
